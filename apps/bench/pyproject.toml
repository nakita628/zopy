[project]
name = "bench"
version = "0.1.0"
description = "Benchmarks: zopy against pydantic on equivalent schemas"
requires-python = ">=3.11"
dependencies = ["zopy", "pydantic>=2.11"]

[project.scripts]
bench = "bench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.uv.sources]
zopy = { workspace = true }
