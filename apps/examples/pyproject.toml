[project]
name = "examples"
version = "0.1.0"
description = "Example app exercising zopy"
requires-python = ">=3.11"
dependencies = ["zopy"]

[project.scripts]
examples = "examples.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examples"]

[tool.uv.sources]
zopy = { workspace = true }
