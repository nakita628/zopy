[project]
name = "zopy"
version = "0.1.0"
description = "Zod (https://zod.dev) ported to Python with the same API, backed by a Rust engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "zopy._core"
features = ["pyo3/extension-module"]
