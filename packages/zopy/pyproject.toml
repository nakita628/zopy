[project]
name = "zopy"
version = "0.1.1"
description = "Zod for Python, typed for pyright, validated by a Rust engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nakita628" }]
keywords = ["zod", "validation", "schema", "parsing", "json-schema", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/nakita628/zopy"
Issues = "https://github.com/nakita628/zopy/issues"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "zopy._core"
features = ["pyo3/extension-module"]
