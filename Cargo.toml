# Cargo workspace. The Rust extension crate lives next to its pyproject.toml in
# packages/zopy, so that directory is both a uv and a Cargo workspace member.
[workspace]
resolver = "2"
members = ["packages/zopy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/nakita628/zopy"

[workspace.dependencies]
pyo3 = "0.25"
pyo3-build-config = { version = "0.25", features = ["resolve-config"] }
regex = "1.11"
fancy-regex = "0.14"
url = "2.5"
base64 = "0.22"
serde_json = "1.0"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
