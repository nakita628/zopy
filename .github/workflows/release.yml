# Releases the version in packages/zopy/pyproject.toml once CI has passed on main: tag the commit,
# build the wheels and the sdist, publish them to PyPI with trusted publishing (OIDC, no token),
# then create the GitHub release with generated notes. Every step skips what is already done, so a
# run that failed part-way (the publish, or the release) is finished by re-running it. A manual run
# builds the current ref and publishes it to TestPyPI only.
#
# `workflow_run` is the trigger zizmor warns about because it hands a token to code from a pull
# request when misused; here every job checks out the commit CI ran on (`head_sha`), only for a
# `push` to main, and only the tag and release jobs can write, through the API.
#
# Interpreters are listed explicitly rather than found (--find-interpreter): runners may carry
# Pythons newer than PyO3 supports.
name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ver.outputs.sha }}
      version: ${{ steps.ver.outputs.version }}
      unpublished: ${{ steps.ver.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Check version and PyPI publish state
        id: ver
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/zopy/pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/zopy/$VERSION/json")
          case "$STATUS" in
            200) echo "unpublished=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "unpublished=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::PyPI answered $STATUS for zopy $VERSION. Check https://status.python.org/ and re-run the workflow"
              exit 1
              ;;
          esac

  tag:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_run'
    permissions:
      contents: write
    steps:
      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          UNPUBLISHED: ${{ needs.check.outputs.unpublished }}
          HEAD_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null); then
            if [ "$UNPUBLISHED" = "false" ]; then
              echo "::error::zopy $VERSION is already on PyPI, but tag v$VERSION does not exist. Tag the commit that was published (git tag v$VERSION <sha> && git push origin v$VERSION), or bump the version and push again"
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$HEAD_SHA" >/dev/null
            echo "created tag v$VERSION at $HEAD_SHA"
            exit 0
          fi
          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "tag v$VERSION already points to $HEAD_SHA; skip"
            exit 0
          fi
          if [ "$UNPUBLISHED" = "false" ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION already fully released from $TAG_SHA; nothing to do for $HEAD_SHA"
            exit 0
          fi
          echo "::error::v$VERSION already points to another commit ($TAG_SHA, expected $HEAD_SHA). Re-run the release workflow for $TAG_SHA, or bump the version in packages/zopy/pyproject.toml and push again"
          exit 1

  linux:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.unpublished == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/zopy
          target: ${{ matrix.platform.target }}
          manylinux: auto
          args: --release --out dist --interpreter python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: packages/zopy/dist

  macos:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.unpublished == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/zopy
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: packages/zopy/dist

  windows:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.unpublished == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/zopy
          target: x64
          args: --release --out dist --interpreter python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-x64
          path: packages/zopy/dist

  sdist:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/zopy
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: packages/zopy/dist

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [linux, macos, windows, sdist]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/zopy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: [check, tag, linux, macos, windows, sdist]
    if: github.event_name == 'workflow_run' && needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zopy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # skip-existing: a re-run after a partial upload publishes only the files still missing.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    name: Create GitHub release
    needs: [check, tag, publish]
    if: >-
      !cancelled() && github.event_name == 'workflow_run' &&
      needs.check.result == 'success' && needs.tag.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; skip"
            exit 0
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
