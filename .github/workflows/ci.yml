name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install workspace
        run: uv sync --locked
      - name: Lint (ruff, rustfmt, clippy)
        run: uv run just lint
      - name: Type-check (pyright)
        run: uv run just typecheck

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: py${{ matrix.python }}
      - name: Use Python ${{ matrix.python }}
        run: uv python pin ${{ matrix.python }}
      - name: Install workspace
        run: uv sync --locked
      # pyo3 caches where libpython is and re-reads it only when PYO3_PYTHON changes, so a target/
      # restored by rust-cache could link against a Python that has since moved. Naming the real
      # interpreter makes a new location or patch release rebuild that config.
      - name: Point pyo3 at the interpreter
        run: uv run python -c 'import os, sys; print("PYO3_PYTHON=" + os.path.realpath(sys.executable))' >> "$GITHUB_ENV"
      - name: Test (pytest on both engines, cargo test)
        run: uv run just test
      - name: Run the examples
        run: uv run just examples

